[project]
name = "scholar-backend"
version = "1.0.0"
description = "Daily Student Enrollment Management System - API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.12",
    "reportlab>=4.2.5",
    "openpyxl>=3.1.5",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    "redis>=5.2.0",
    "orjson>=3.10.7",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "pypdfium2>=4.30.0",
    # 4.x: OpenCV 5 dropped CascadeClassifier and the bundled face models.
    "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
    "tesserocr; platform_system != 'Windows'",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "N"]
ignore = ["B008", "N818", "E501"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/*.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true
