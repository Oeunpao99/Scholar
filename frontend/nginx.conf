server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Report scans/uploads (backend allows 12 MB).
    client_max_body_size 15m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf;

    # Vite fingerprints these file names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html, which must never be cached
    # or users keep loading an old build after a deploy. (add_header in a
    # location replaces any server-level ones, so security headers live here.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Proxy API calls to the backend container (same origin, no CORS needed).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI/OCR parsing can take up to ~45 s.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
